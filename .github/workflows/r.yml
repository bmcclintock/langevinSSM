# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Forces r-lib actions to use Node 24

    steps:
      - uses: actions/checkout@v4

      - name: Install and configure OpenMP (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          mkdir -p ~/.R
          echo "CPPFLAGS += -I/opt/homebrew/opt/libomp/include" >> ~/.R/Makevars
          echo "LDFLAGS += -L/opt/homebrew/opt/libomp/lib -lomp" >> ~/.R/Makevars
          echo "CXXFLAGS += -I/opt/homebrew/opt/libomp/include -Xclang -fopenmp" >> ~/.R/Makevars
          echo "CXX11FLAGS += -I/opt/homebrew/opt/libomp/include -Xclang -fopenmp" >> ~/.R/Makevars
          echo "CXX14FLAGS += -I/opt/homebrew/opt/libomp/include -Xclang -fopenmp" >> ~/.R/Makevars

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          cache-version: 2
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          remove-openmp-macos: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            jmlondon/pathroutr
            TMB=?source
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran", "--install-args=--strip")'
